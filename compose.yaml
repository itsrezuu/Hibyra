
services:
  app:
    build:
      context: .
    image: renanthera/hibyra:local
    container_name: hibyra-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    command: >
      sh -c "php artisan migrate --force &&
             exec apache2-foreground"

  db:
    image: mysql:8.0
    container_name: hibyra-db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - hibyra_mysql_data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hibyra_mysql_data:

networks:
  default:
    name: hibyra_default
    driver: bridge
